name: Agent Gate Evaluation Kit

on:
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation-kit.yml"
  push:
    branches:
      - main
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation-kit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate evaluation package
        run: python evaluation/validate_evaluation_package.py
      - name: Test evaluation package safeguards
        run: python -m unittest discover -s evaluation -p "test_*.py" -v
