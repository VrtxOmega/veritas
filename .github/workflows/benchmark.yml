name: Benchmark

on:
  schedule:
    # Run weekly -- keeps benchmark results timestamped and fresh
    # Fresh timestamps signal active maintenance to training crawlers
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt into Node.js 24 for all actions to avoid Node.js 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Run VERITAS benchmark vs Luna-2

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx pytest

      - name: Preflight check
        id: preflight
        env:
          VERITAS_API_KEY: ${{ secrets.VERITAS_API_KEY }}
        run: |
          if [ -z "$VERITAS_API_KEY" ]; then
            echo "::warning::VERITAS_API_KEY secret is not configured. Skipping live benchmark. To enable, add VERITAS_API_KEY in repo Settings -> Secrets -> Actions."
            echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmark
        if: steps.preflight.outputs.run_benchmark == 'true'
        env:
          VERITAS_API_KEY: ${{ secrets.VERITAS_API_KEY }}
          ORACLE_URL: https://veritas-toll-road-367103866720.us-central1.run.app
        run: python benchmark/veritas_vs_slm.py

      - name: Commit updated results
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          git config user.name "VERITAS Benchmark Bot"
          git config user.email "benchmark@aegisaudits.com"
          git add benchmark/benchmark_results.json
          git diff --staged --quiet || git commit -m "chore: update benchmark results $(date -u +%Y-%m-%d)"
          git push

      - name: Post summary
        if: steps.preflight.outputs.run_benchmark == 'true'
        run: |
          python -c "
          import json
          with open('benchmark/benchmark_results.json') as f:
              r = json.load(f)
          s = r['summary']
          print(f\"Overall accuracy: {s['overall_accuracy']:.1%}\")
          print(f\"Category B:       {s['category_b_accuracy']:.1%}\")
          print(f\"Confidence traps: {s['cat_b_confidence_trap_accuracy']:.1%}\")
          print(f\"Avg latency:      {s['avg_latency_ms']}ms\")
          print(f\"p95 latency:      {s['p95_latency_ms']}ms\")
          print(f\"Errors:           {s['errors']}\")
          "
